const apps=[["KakaoTalk","kkt"],["Instagram","ig"],["X","x"],["相册","photos"],["备忘录","notes"],["文件","files"],["日历","calendar"],["地图","map"],["设置","settings"],["YouTube","youtube"],["Spotify","spotify"],["相机","camera"],["电话","phone"],["外卖民族","delivery"]];
function icon(k){return icons[k]||({calendar:icons.generic("31","#fff"),map:icons.generic("🗺️","#b8e3f6"),settings:icons.generic("⚙️","#a5a6ad"),youtube:icons.generic("▶","#fa2222"),spotify:icons.generic("≋","#18c85e"),delivery:icons.generic("배","#28c5ac")}[k]||icons.generic("✦","#888"))}
function appBtn(name,key,dock=false){return `<button class="app" onclick="openApp('${key}')"><span class="appicon">${icon(key)}</span>${dock?"":`<span>${name}</span>`}</button>`}
$("apps").innerHTML=apps.slice(0,8).map(a=>appBtn(...a)).join("");$("apps2").innerHTML=apps.slice(8).map(a=>appBtn(...a)).join("");$("dock").innerHTML=[["电话","phone"],["KakaoTalk","kkt"],["信息","msg"],["相机","camera"]].map(a=>appBtn(...a,true)).join("");
function goHome(){activeApp=null;stopRing();callSession++;$("call").classList.remove("show");clearInterval(callTimer);show("home")}
function setHomePage(n){homePage=Math.max(0,Math.min(1,n));$("pages").style.transform=`translateX(-${homePage*50}%)`;for(let i=0;i<2;i++)$("dot"+i).classList.toggle("on",i===homePage)}
let homeX=0,homeY=0;
$("home").addEventListener("touchstart",e=>{homeX=e.touches[0].clientX;homeY=e.touches[0].clientY},{passive:true});
$("home").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-homeX,dy=e.changedTouches[0].clientY-homeY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)setHomePage(homePage+(dx<0?1:-1))},{passive:true});
$("home").addEventListener("mousedown",e=>{homeX=e.clientX;homeY=e.clientY});
$("home").addEventListener("mouseup",e=>{let dx=e.clientX-homeX,dy=e.clientY-homeY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)setHomePage(homePage+(dx<0?1:-1))});
document.querySelector(".page-dots").addEventListener("click",e=>{if(e.target.id==="dot0")setHomePage(0);if(e.target.id==="dot1")setHomePage(1)});
function audioReady(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,duration,volume=.09,delay=0){let c=audioReady();if(!c)return;let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration+.03)}
function ding(){tone(880,.24,.075);tone(1320,.22,.035,.05)}
function ringOnce(){tone(440,.26,.075);tone(480,.26,.075,.34)}
function startRing(){stopRing();ringOnce();ringTimer=setInterval(ringOnce,1550)}
function stopRing(){if(ringTimer){clearInterval(ringTimer);ringTimer=null}}
function notify(message){if(activeApp==="kkt"&&current==="appview")return;ding();$("toast").textContent="KakaoTalk · "+message;$("toast").style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").style.display="none",3600)}

function wrap(title,body,extra=""){show("appview");$("appbody").innerHTML=`<div class="apphead"><button class="back" onclick="goHome()">‹ 返回</button><span>${title}</span><span style="width:48px;text-align:right">${extra}</span></div>${body}`}

 ],
 spotify:[

function openMediaEgg(platform,query){
 const base=platform==='youtube'?'https://www.youtube.com/results?search_query=':'https://open.spotify.com/search/';
 const url=base+encodeURIComponent(query);
 const opened=window.open(url,'_blank','noopener,noreferrer');
 if(!opened){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.click()}
}
function mediaEggApp(platform){
 activeApp=platform;
 const isYT=platform==='youtube', title=isYT?'YouTube':'Spotify', accent=isYT?'#ef2929':'#1db954';
 const entries=mediaEasterEggs[platform];
 const cards=entries.map(([name,query,glyph],i)=>'<button type="button" class="media-egg-card" onclick="openMediaEgg(\''+platform+'\','+JSON.stringify(query).replace(/"/g,'&quot;')+')" style="width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:transparent;color:inherit;padding:12px 3px;border-bottom:1px solid #e8e8ed"><span style="width:56px;height:56px;flex-shrink:0;border-radius:12px;background:'+accent+';color:white;display:grid;place-items:center;font-size:24px">'+glyph+'</span><span style="flex:1;min-width:0"><strong style="display:block;font-size:15px">'+name+'</strong><small style="display:block;color:#888;margin-top:5px">打开 '+title+' 查看与播放</small></span><span style="color:#999;font-size:22px">›</span></button>').join('');
 wrap(title,'<div class="content" style="padding:18px 20px 90px;overflow:auto;height:calc(100% - 65px);background:#fff"><div style="padding:14px 0 20px"><div style="font-size:26px;font-weight:750">'+(isYT?'最近观看与收藏':'音乐资料库')+'</div><p style="color:#777;font-size:13px;line-height:1.6">姜敏熙的娱乐收藏 · 全章节自由探索</p></div>'+cards+'<p style="font-size:12px;color:#888;line-height:1.6;margin-top:20px">彩蛋内容不影响主线。点击后在浏览器新标签页打开平台搜索结果，请选择官方内容播放；部分音乐可能需要登录或订阅。私人收藏名称为虚构同人设定。</p></div>');
}
function openApp(k){activeApp=k;if(k==="youtube"||k==="spotify"){mediaEggApp(k);return}if(k==="ig"){instagram();return}if(k==="kkt"){friends();return}if(k==="phone"){calls();return}if(k==="x"){twitter();return}if(k==="notes"){noteList();return}if(k==="photos"){igAlbum();return}if(k==="msg"){messages();return}if(k==="camera"){camera();return}wrap(apps.find(a=>a[1]===k)?.[0]||"应用",'<div class="content" style="padding-top:45px;text-align:center;color:#888">这里暂时没有新的内容</div>')}
function friends(){activeApp="kkt";wrap("好友",`<div class="content"><div class="item" onclick="profile()"><div class="avatar">夏</div><div class="itemmain"><div class="itemtitle">${CONFIG.userName}</div><div class="itemsub">今天也要开心</div></div></div><h4>好友 1</h4><div class="item" onclick="chatRoom()"><div class="avatar">允</div><div class="itemmain"><div class="itemtitle">${CONFIG.contactName}</div><div class="itemsub">${chat.at(-1)?.text||""}</div></div><span class="muted">1</span></div></div><div class="tabs"><button onclick="friends()">●<br>好友</button><button onclick="chatRoom()">▤<br>聊天</button><button onclick="friends()">⌕<br>发现</button><button onclick="profile()">•••<br>更多</button></div>`)}
function profile(){activeApp="kkt";wrap("个人资料",`<div class="content" style="text-align:center;padding-top:65px"><div class="avatar" style="margin:auto;width:100px;height:100px;font-size:40px">夏</div><h2>${CONFIG.userName}</h2><p>今天也要开心</p><button class="choice" onclick="friends()">返回好友列表</button></div>`)}
function chatRoom(){activeApp="kkt";let rows=chat.map(m=>`<div class="bubbleline ${m.from==="me"?"me":""}">${m.from==="me"?`<span class="chatmeta">${m.time||"刚刚"}</span>`:""}<div class="bubble">${escapeHtml(m.text)}</div>${m.from!=="me"?`<span class="chatmeta">${m.time||"刚刚"}</span>`:""}</div>`).join("");
let next=CONFIG.story[storyIndex],btn=next&&!storyBusy?`<button onclick="advanceStory()"><strong>发送</strong>　${escapeHtml(next.text)}</button>`:next?`<button disabled>正在等待对方回复…</button>`:`<div class="story-end" role="status">当前对话已结束</div>`;
wrap(CONFIG.contactName,`<div class="chatbody" id="chatbody">${rows}</div><div class="story-send">${btn}</div>`);$("chatbody").scrollTop=$("chatbody").scrollHeight}
function saveChat(){localStorage.setItem("story_chat",JSON.stringify(chat))}
function advanceStory(){if(storyBusy||storyIndex>=CONFIG.story.length)return;let entry=CONFIG.story[storyIndex];if(entry.from!=="me")return;chat.push({from:"me",text:entry.text,time:"刚刚"});storyIndex++;localStorage.setItem("story_index",storyIndex);saveChat();storyBusy=true;chatRoom();nextStoryReply()}
function nextStoryReply(){let entry=CONFIG.story[storyIndex];if(!entry||entry.from==="me"){storyBusy=false;if(current==="appview"&&$("chatbody"))chatRoom();return}setTimeout(()=>{chat.push({from:"them",text:entry.text,time:"刚刚"});storyIndex++;localStorage.setItem("story_index",storyIndex);saveChat();notify(entry.text);if(current==="appview"&&$("chatbody"))chatRoom();nextStoryReply()},entry.delay||1300)}
function calls(){let missed=[['宋亨俊',9,'晚上 9:18'],['朴世琳',3,'晚上 8:43'],['徐宇瑸',1,'下午 6:10']];wrap("最近通话",`<div class="content"><h4>今天</h4>${missed.map(([name,count,time])=>`<div class="item" onclick="startPhoneCall()"><div class="itemmain"><div class="itemtitle" style="color:#f24c4c">${name} (${count})</div><div class="itemsub">未接来电 · ${time}</div></div><span class="muted">ⓘ</span></div>`).join('')}</div><div class="tabs"><button>☆<br>个人收藏</button><button onclick="calls()">◷<br>最近通话</button><button>▦<br>通讯录</button><button>▦<br>拨号键盘</button></div>`)}

function twitter(){wrap("X",`<div class="content" style="background:#000;color:#fff;margin:0 -18px;padding:10px 20px"><div style="height:100px;background:linear-gradient(120deg,#2b364a,#836c83);border-radius:8px"></div><div class="avatar" style="margin-top:-28px;border:4px solid #000">夏</div><h2>${CONFIG.userName} 🔒</h2><div style="color:#999">${CONFIG.twitterHandle}</div><p>有些话只想留给自己。</p><p style="font-size:13px;color:#aaa">关注 42　粉丝 18</p><hr style="border-color:#333">${CONFIG.tweets.map((t,i)=>`<div class="tweet"><strong>${CONFIG.userName} 🔒</strong><div style="font-size:12px;color:#888">${CONFIG.twitterHandle} · ${i+1}天前</div><p>${escapeHtml(t)}</p><div class="actions"><span>♡ 2</span><span>↻ 1</span><button onclick="like(${i})">${likes[i]?"♥ 已赞":"♡ 点赞"}</button></div></div>`).join("")}</div>`)}

function noteList(){wrap("备忘录",`<div class="content"><button class="choice" onclick="editNote(-1)">＋ 新建备忘录</button>${notes.map((n,i)=>`<div class="note" onclick="editNote(${i})"><strong>${escapeHtml(n.slice(0,22))}</strong><div class="itemsub">${escapeHtml(n.slice(22,75))||"点击查看"}</div></div>`).join("")}</div>`)}

function camera(){wrap("相机",`<div class="content" style="background:#222;margin:0 -18px;display:grid;place-items:center;color:white"><div>模拟取景器</div><button class="roundglass" onclick="alert('已拍照（演示模式）')">◉</button></div>`)}

function startCall(type="Instagram",incoming=false){audioReady();callSession++;clearInterval(callTimer);$("call").classList.add("show");$("answer").style.display="block";$("pip").style.display="none";$("callerName").textContent="宋亨俊";$("calltimer").textContent=type+(type==="电话"?"":" 视频")+"通话 · 来电中…";$("callsub").textContent=type+"通话";$("callmsg").textContent="";storyCallPending=incoming;startRing()}
function answerCall(){stopRing();$("answer").style.display="none";$("pip").style.display="grid";$("callsub").textContent="正在通话";callStart=Date.now();let session=callSession;clearInterval(callTimer);callTimer=setInterval(()=>{let s=Math.floor((Date.now()-callStart)/1000);$("calltimer").textContent=`通话中 · ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`},500);let lines=storyCallPending?[{delay:700,text:"宋亨俊：你怎么才接电话？"},{delay:3200,text:"宋亨俊：我都快担心死了，你在哪儿？"}]:CONFIG.callLines;lines.forEach(line=>setTimeout(()=>{if(callSession===session&&$("call").classList.contains("show"))$("callmsg").textContent=line.text},line.delay))}
function endCall(){storyCallPending=false;stopRing();clearInterval(callTimer);goHome()}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
