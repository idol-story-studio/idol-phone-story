<body>
<div id="phone">
<section id="lock" class="screen wall active"><div class="status light"><span class="statusclock">19:21</span><span>▂▄▆  ◉  ▰</span></div><div class="lock-date"><div class="date" id="lockdate"></div><div class="clock" id="lockclock"></div></div><div class="lock-bottom"><div class="lock-actions"><button class="roundglass" onclick="openPass()">⌁</button><button class="roundglass" onclick="openPass()">◉</button></div><div class="hint" onclick="openPass()">向上轻扫以解锁 ⌃</div></div><div class="homebar" onclick="openPass()"></div></section>
<section id="pass" class="screen wall"><div class="status light"><span class="statusclock"></span><span>▂▄▆  ◉  ▰</span></div><div class="pass-title">输入密码<div class="dots" id="dots"></div><div id="passerror" style="font-size:13px;min-height:18px"></div></div><div class="keypad" id="keys"></div><div class="pass-footer"><button class="textbtn" onclick="show('lock')">取消</button><button class="textbtn" onclick="erase()">删除</button></div></section>

<section id="appview" class="screen appscreen"><div class="status dark"><span class="statusclock"></span><span>▂▄▆  ◉  ▰</span></div><div id="appbody"></div><div class="homebar dark" onclick="goHome()"></div></section>
<div class="modal" id="call"><div class="calltimer" id="calltimer">Instagram 视频通话 · 来电中…</div><div class="avatar" style="width:100px;height:100px;border-radius:50%;font-size:40px">允</div><div class="call-name">姜允澈</div><div id="callsub">Instagram 视频通话</div><div class="pip" id="pip" style="display:none">我的画面</div><div class="callmsg" id="callmsg"></div><div class="call-controls"><button class="callbtn red" onclick="endCall()">☎</button><button class="callbtn green" id="answer" onclick="answerCall()">☎</button></div></div>

<script>
const CONFIG={
  password:"1130",userName:"林知夏",contactName:"姜允澈",twitterHandle:"@xia_private",
  chat:[{from:"them",text:"你到家了吗？",time:"晚上 9:14"},{from:"me",text:"刚到，你呢？",time:"晚上 9:15"},{from:"them",text:"我还在练习室。今天的事……我想当面和你说。",time:"晚上 9:16"}],
  tweets:["今天的月亮很亮。突然想起某个人说过，看到月亮就会想到我。","如果明天可以不用假装不认识就好了。"],
  notes:["11月30日：记得给他准备生日礼物。","没有发出去的那封信：其实我一直都知道。"],
  photos:["🌆","🌙","☕","🎤","🌷","🐈","🎞️","🌊","💌"],
  story:[
    {from:"me",text:"那我们明天见吧。",delay:0},
    {from:"them",text:"好，我明天来接你。",delay:1200},
    {from:"them",text:"不过，别告诉其他人。",delay:1900},
    {from:"me",text:"放心，我知道。",delay:0},
    {from:"them",text:"谢谢你一直等我。晚安。",delay:1500}
  ],
  callLines:[{delay:1800,text:"允澈：终于接了。我有点想你。"}, {delay:4800,text:"允澈：明天能见一面吗？"}]
};
const $=id=>document.getElementById(id);
let current="lock",pass="",chat=JSON.parse(localStorage.getItem("story_chat")||"null")||CONFIG.chat.slice(),notes=JSON.parse(localStorage.getItem("story_notes")||"null")||CONFIG.notes.slice(),likes=JSON.parse(localStorage.getItem("story_likes")||"{}"),callStart=0,callTimer=null,ringTimer=null,audioCtx=null,callSession=0,storyIndex=Number(localStorage.getItem("story_index")||0),storyBusy=false,homePage=0,toastTimer=null;
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");current=id}
function tick(){let d=new Date(),t=d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false});$("lockclock").textContent=t;$("lockdate").textContent=d.toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"long"});document.querySelectorAll(".statusclock").forEach(x=>x.textContent=t)}tick();setInterval(tick,1000);
let sy=0;$("lock").addEventListener("touchstart",e=>sy=e.touches[0].clientY,{passive:true});$("lock").addEventListener("touchend",e=>{if(sy-e.changedTouches[0].clientY>45)openPass()});$("lock").addEventListener("mousedown",e=>sy=e.clientY);$("lock").addEventListener("mouseup",e=>{if(sy-e.clientY>45)openPass()});
function openPass(){pass="";drawDots();show("pass")}function drawDots(){$("dots").innerHTML=Array.from({length:4},(_,i)=>'<div class="dot '+(i<pass.length?'filled':'')+'"></div>').join("")}
$("keys").innerHTML=[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(n=>n===""?'<span></span>':`<button class="key" onclick="${n==="⌫"?"erase()":`digit('${n}')`}">${n}</button>`).join("");
function digit(n){if(pass.length>=4)return;pass+=n;drawDots();if(pass.length===4)setTimeout(()=>{if(pass===CONFIG.password){show("home");$("passerror").textContent=""}else{$("passerror").textContent="密码错误，请重试";pass="";drawDots()}},180)}function erase(){pass=pass.slice(0,-1);drawDots()}document.addEventListener("keydown",e=>{if(current==="pass"){if(/^\d$/.test(e.key))digit(e.key);if(e.key==="Backspace")erase()}});
const icons={
kkt:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#FEE500"/><path d="M32 13C17 13 9 22 9 32c0 7 4 12 10 16l-3 10 12-7c16 2 27-7 27-19S45 13 32 13Z" fill="#371F1F"/><text x="32" y="37" font-size="15" font-weight="900" text-anchor="middle" fill="#FEE500">TALK</text></svg>`,
phone:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#32C85B"/><path d="M19 12c-4 1-7 5-6 11 2 14 15 27 28 29 6 1 11-2 12-7l-12-8-6 5c-6-3-10-7-13-13l5-6-8-11Z" fill="white"/></svg>`,
msg:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#36C966"/><path d="M12 18Q12 10 24 10H40Q54 10 54 25V35Q54 48 40 48H26L15 56l3-12Q10 40 10 32Z" fill="white"/></svg>`,
ig:`<svg viewBox="0 0 64 64"><defs><linearGradient id="iggrad" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffcd53"/><stop offset=".45" stop-color="#ef2c6d"/><stop offset="1" stop-color="#7a39d7"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#iggrad)"/><rect x="16" y="16" width="32" height="32" rx="10" fill="none" stroke="white" stroke-width="4"/><circle cx="32" cy="32" r="8" fill="none" stroke="white" stroke-width="4"/><circle cx="42" cy="22" r="3" fill="white"/></svg>`,
x:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#050505"/><path d="M14 13h10l27 38H41L14 13Zm6 4 23 30" stroke="white" stroke-width="3" fill="none"/><path d="M50 13 14 51" stroke="white" stroke-width="3"/></svg>`,
photos:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="white"/><g transform="translate(32 32)"><ellipse ry="15" rx="7" fill="#f33" transform="rotate(0) translate(0 -9)"/><ellipse ry="15" rx="7" fill="#f90" transform="rotate(45) translate(0 -9)"/><ellipse ry="15" rx="7" fill="#ffdf33" transform="rotate(90) translate(0 -9)"/><ellipse ry="15" rx="7" fill="#3c5" transform="rotate(135) translate(0 -9)"/><ellipse ry="15" rx="7" fill="#3be" transform="rotate(180) translate(0 -9)"/><ellipse ry="15" rx="7" fill="#67f" transform="rotate(225) translate(0 -9)"/><ellipse ry="15" rx="7" fill="#a5e" transform="rotate(270) translate(0 -9)"/><ellipse ry="15" rx="7" fill="#e5a" transform="rotate(315) translate(0 -9)"/><circle r="7" fill="white"/></g></svg>`,
notes:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#fff"/><path d="M0 0h64v17H0Z" fill="#ffcc3e"/><path d="M13 28h38M13 36h38M13 44h30" stroke="#b8b8b8" stroke-width="2"/></svg>`,
camera:`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#d8d9dd"/><rect x="10" y="20" width="44" height="30" rx="7" fill="#fff"/><circle cx="32" cy="35" r="12" fill="#9fa3aa"/><circle cx="32" cy="35" r="8" fill="#444c5d"/></svg>`,
generic:(emoji,bg)=>`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="${bg}"/><text x="32" y="43" font-size="32" text-anchor="middle">${emoji}</text></svg>`
};
const apps=[["KakaoTalk","kkt"],["Instagram","ig"],["X","x"],["相册","photos"],["备忘录","notes"],["日历","calendar"],["地图","map"],["设置","settings"],["YouTube","youtube"],["Spotify","spotify"],["相机","camera"],["电话","phone"]];
function icon(k){return icons[k]||({calendar:icons.generic("31","#fff"),map:icons.generic("🗺️","#b8e3f6"),settings:icons.generic("⚙️","#a5a6ad"),youtube:icons.generic("▶","#fa2222"),spotify:icons.generic("≋","#18c85e")}[k]||icons.generic("✦","#888"))}
function appBtn(name,key,dock=false){return `<button class="app" onclick="openApp('${key}')"><span class="appicon">${icon(key)}</span>${dock?"":`<span>${name}</span>`}</button>`}
$("apps").innerHTML=apps.slice(0,8).map(a=>appBtn(...a)).join("");$("apps2").innerHTML=apps.slice(8).map(a=>appBtn(...a)).join("");$("dock").innerHTML=[["电话","phone"],["KakaoTalk","kkt"],["信息","msg"],["相机","camera"]].map(a=>appBtn(...a,true)).join("");
function goHome(){stopRing();callSession++;$("call").classList.remove("show");clearInterval(callTimer);show("home")}
function setHomePage(n){homePage=Math.max(0,Math.min(1,n));$("pages").style.transform=`translateX(-${homePage*50}%)`;for(let i=0;i<2;i++)$("dot"+i).classList.toggle("on",i===homePage)}
let homeX=0,homeY=0;
$("home").addEventListener("touchstart",e=>{homeX=e.touches[0].clientX;homeY=e.touches[0].clientY},{passive:true});
$("home").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-homeX,dy=e.changedTouches[0].clientY-homeY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)setHomePage(homePage+(dx<0?1:-1))},{passive:true});
$("home").addEventListener("mousedown",e=>{homeX=e.clientX;homeY=e.clientY});
$("home").addEventListener("mouseup",e=>{let dx=e.clientX-homeX,dy=e.clientY-homeY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.3)setHomePage(homePage+(dx<0?1:-1))});
document.querySelector(".page-dots").addEventListener("click",e=>{if(e.target.id==="dot0")setHomePage(0);if(e.target.id==="dot1")setHomePage(1)});
function audioReady(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}catch(e){return null}}
function tone(freq,duration,volume=.09,delay=0){let c=audioReady();if(!c)return;let o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration+.03)}
function ding(){tone(880,.24,.075);tone(1320,.22,.035,.05)}
function ringOnce(){tone(440,.26,.075);tone(480,.26,.075,.34)}
function startRing(){stopRing();ringOnce();ringTimer=setInterval(ringOnce,1550)}
function stopRing(){if(ringTimer){clearInterval(ringTimer);ringTimer=null}}
function notify(message){ding();$("toast").textContent="KakaoTalk · "+message;$("toast").style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").style.display="none",3600)}

function wrap(title,body,extra=""){show("appview");$("appbody").innerHTML=`<div class="apphead"><button class="back" onclick="goHome()">‹ 返回</button><span>${title}</span><span style="width:48px;text-align:right">${extra}</span></div>${body}`}
function openApp(k){if(k==="ig"){startCall();return}if(k==="kkt"){friends();return}if(k==="phone"){calls();return}if(k==="x"){twitter();return}if(k==="notes"){noteList();return}if(k==="photos"){photos();return}if(k==="msg"){messages();return}if(k==="camera"){camera();return}wrap(apps.find(a=>a[1]===k)?.[0]||"应用",'<div class="content" style="padding-top:45px;text-align:center;color:#888">这里暂时没有新的内容</div>')}
function friends(){wrap("好友",`<div class="content"><div class="item" onclick="profile()"><div class="avatar">夏</div><div class="itemmain"><div class="itemtitle">${CONFIG.userName}</div><div class="itemsub">今天也要开心</div></div></div><h4>好友 1</h4><div class="item" onclick="chatRoom()"><div class="avatar">允</div><div class="itemmain"><div class="itemtitle">${CONFIG.contactName}</div><div class="itemsub">${chat.at(-1)?.text||""}</div></div><span class="muted">1</span></div></div><div class="tabs"><button onclick="friends()">●<br>好友</button><button onclick="chatRoom()">▤<br>聊天</button><button onclick="friends()">⌕<br>发现</button><button onclick="profile()">•••<br>更多</button></div>`)}
function profile(){wrap("个人资料",`<div class="content" style="text-align:center;padding-top:65px"><div class="avatar" style="margin:auto;width:100px;height:100px;font-size:40px">夏</div><h2>${CONFIG.userName}</h2><p>今天也要开心</p><button class="choice" onclick="friends()">返回好友列表</button></div>`)}
function chatRoom(){let rows=chat.map(m=>`<div class="bubbleline ${m.from==="me"?"me":""}">${m.from==="me"?`<span class="chatmeta">${m.time||"刚刚"}</span>`:""}<div class="bubble">${escapeHtml(m.text)}</div>${m.from!=="me"?`<span class="chatmeta">${m.time||"刚刚"}</span>`:""}</div>`).join("");
let next=CONFIG.story[storyIndex],btn=next&&!storyBusy?`<button onclick="advanceStory()"><strong>发送</strong>　${escapeHtml(next.text)}</button>`:next?`<button disabled>正在等待对方回复…</button>`:`<div class="story-end">当前聊天已读完 <button onclick="restartStory()" style="margin-left:8px;padding:8px 12px;background:#fee500;border-radius:12px">重新阅读</button></div>`;
wrap(CONFIG.contactName,`<div class="chatbody" id="chatbody">${rows}</div><div class="story-send">${btn}</div>`);$("chatbody").scrollTop=$("chatbody").scrollHeight}
function saveChat(){localStorage.setItem("story_chat",JSON.stringify(chat))}
function restartStory(){chat=CONFIG.chat.slice();storyIndex=0;storyBusy=false;saveChat();localStorage.setItem("story_index","0");chatRoom()}
function advanceStory(){if(storyBusy||storyIndex>=CONFIG.story.length)return;let entry=CONFIG.story[storyIndex];if(entry.from!=="me")return;chat.push({from:"me",text:entry.text,time:"刚刚"});storyIndex++;localStorage.setItem("story_index",storyIndex);saveChat();storyBusy=true;chatRoom();nextStoryReply()}
function nextStoryReply(){let entry=CONFIG.story[storyIndex];if(!entry||entry.from==="me"){storyBusy=false;if(current==="appview"&&$("chatbody"))chatRoom();return}setTimeout(()=>{chat.push({from:"them",text:entry.text,time:"刚刚"});storyIndex++;localStorage.setItem("story_index",storyIndex);saveChat();notify(entry.text);if(current==="appview"&&$("chatbody"))chatRoom();nextStoryReply()},entry.delay||1300)}
function calls(){wrap("最近通话",`<div class="content"><h4>今天</h4><div class="item" onclick="startPhoneCall()"><div class="itemmain"><div class="itemtitle" style="color:#f24c4c">${CONFIG.contactName} (2)</div><div class="itemsub">未接来电 · 晚上 9:18</div></div>ⓘ</div><div class="item" onclick="startPhoneCall()"><div class="itemmain"><div class="itemtitle">${CONFIG.contactName}</div><div class="itemsub">呼出电话 · 下午 4:20</div></div>ⓘ</div><h4>昨天</h4><div class="item"><div class="itemmain"><div class="itemtitle">经纪人</div><div class="itemsub">来电 · 上午 11:05</div></div>ⓘ</div></div><div class="tabs"><button>☆<br>个人收藏</button><button onclick="calls()">◷<br>最近通话</button><button>▦<br>通讯录</button><button>▦<br>拨号键盘</button></div>`)}
function twitter(){wrap("X",`<div class="content" style="background:#000;color:#fff;margin:0 -18px;padding:10px 20px"><div style="height:100px;background:linear-gradient(120deg,#2b364a,#836c83);border-radius:8px"></div><div class="avatar" style="margin-top:-28px;border:4px solid #000">夏</div><h2>${CONFIG.userName} 🔒</h2><div style="color:#999">${CONFIG.twitterHandle}</div><p>有些话只想留给自己。</p><p style="font-size:13px;color:#aaa">关注 42　粉丝 18</p><hr style="border-color:#333">${CONFIG.tweets.map((t,i)=>`<div class="tweet"><strong>${CONFIG.userName} 🔒</strong><div style="font-size:12px;color:#888">${CONFIG.twitterHandle} · ${i+1}天前</div><p>${escapeHtml(t)}</p><div class="actions"><span>♡ 2</span><span>↻ 1</span><button onclick="like(${i})">${likes[i]?"♥ 已赞":"♡ 点赞"}</button></div></div>`).join("")}</div>`)}
function like(i){likes[i]=!likes[i];localStorage.setItem("story_likes",JSON.stringify(likes));twitter()}
function noteList(){wrap("备忘录",`<div class="content"><button class="choice" onclick="editNote(-1)">＋ 新建备忘录</button>${notes.map((n,i)=>`<div class="note" onclick="editNote(${i})"><strong>${escapeHtml(n.slice(0,22))}</strong><div class="itemsub">${escapeHtml(n.slice(22,75))||"点击查看"}</div></div>`).join("")}</div>`)}
function editNote(i){wrap(i<0?"新备忘录":"备忘录",`<div class="content"><div class="note"><textarea id="notetext" placeholder="写点什么…">${i<0?"":escapeHtml(notes[i])}</textarea></div><button class="choice" onclick="saveNote(${i})">保存备忘录</button></div>`)}
function saveNote(i){let v=$("notetext").value;if(i<0)notes.unshift(v);else notes[i]=v;localStorage.setItem("story_notes",JSON.stringify(notes));noteList()}
function photos(){wrap("照片",`<div class="content"><h3>最近项目</h3><div class="photo-grid">${CONFIG.photos.map((p,i)=>`<div class="photo" onclick="viewPhoto(${i})">${p}</div>`).join("")}</div></div>`)}
function viewPhoto(i){wrap("照片",`<div class="content" style="display:grid;place-items:center;background:#151515;margin:0 -18px;color:white"><div style="font-size:130px">${CONFIG.photos[i]}</div><p>照片 ${i+1} / ${CONFIG.photos.length}</p><button class="choice" onclick="photos()">返回相册</button></div>`)}
function messages(){wrap("信息",`<div class="content"><div class="item" onclick="chatRoom()"><div class="avatar">允</div><div class="itemmain"><strong>${CONFIG.contactName}</strong><div class="itemsub">你今天还好吗？</div></div></div></div>`)}
function camera(){wrap("相机",`<div class="content" style="background:#222;margin:0 -18px;display:grid;place-items:center;color:white"><div>模拟取景器</div><button class="roundglass" onclick="alert('已拍照（演示模式）')">◉</button></div>`)}
function startPhoneCall(){startCall("电话")}
function startCall(type="Instagram"){audioReady();callSession++;clearInterval(callTimer);$("call").classList.add("show");$("answer").style.display="block";$("pip").style.display="none";$("calltimer").textContent=type+" 视频通话 · 来电中…";$("callsub").textContent=type+" 视频通话";$("callmsg").textContent="";startRing()}
function answerCall(){stopRing();$("answer").style.display="none";$("pip").style.display="grid";$("callsub").textContent="正在通话";callStart=Date.now();let session=callSession;clearInterval(callTimer);callTimer=setInterval(()=>{let s=Math.floor((Date.now()-callStart)/1000);$("calltimer").textContent=`通话中 · ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`},500);CONFIG.callLines.forEach(line=>setTimeout(()=>{if(callSession===session&&$("call").classList.contains("show"))$("callmsg").textContent=line.text},line.delay))}
function endCall(){stopRing();clearInterval(callTimer);goHome()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
